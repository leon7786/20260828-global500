<!DOCTYPE html>
<html lang="zh-CN" class="theme-light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>世界 500 强创始人全景史诗传记智库 | Fortune Global 500</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          screens: {
            'xs': '375px',
            'sm': '640px',
            'md': '768px',
            'lg': '1024px',
            'xl': '1280px',
            '2xl': '1536px',
          },
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e',
            }
          }
        }
      }
    }
  </script>

  <!-- Marked Markdown Parser & DOMPurify -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');
    
    *, *::before, *::after {
      box-sizing: border-box;
    }

    /* ---------------------------------------------------- */
    /* Dynamic Theme Variables                             */
    /* ---------------------------------------------------- */
    :root.theme-light {
      --bg-page: #f8fafc;
      --bg-surface: #ffffff;
      --bg-sidebar: #ffffff;
      --bg-sidebar-hover: #f1f5f9;
      --bg-active: #e0f2fe;
      --border-color: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #334155;
      --text-dim: #64748b;
      --prose-h1: #0f172a;
      --prose-h2: #0284c7;
      --prose-h3: #b45309;
      --prose-p: #334155;
      --quote-bg: #fffbeb;
      --quote-border: #f59e0b;
      --quote-text: #92400e;
      --code-bg: #f8fafc;
      --code-border: #e2e8f0;
      --code-text: #0369a1;
      --table-header: #f1f5f9;
      --card-shadow: 0 1px 3px rgba(0,0,0,0.03), 0 1px 2px rgba(0,0,0,0.02);
    }

    /* 📜 Sepia Warm Paper Eye-Protection Theme */
    :root.theme-sepia {
      --bg-page: #fbf7ee;
      --bg-surface: #f4ede0;
      --bg-sidebar: #f7f1e5;
      --bg-sidebar-hover: #ede3d1;
      --bg-active: #e9dec9;
      --border-color: #e3d5bf;
      --text-main: #2c251e;
      --text-muted: #4a3f35;
      --text-dim: #7d6f5d;
      --prose-h1: #2c251e;
      --prose-h2: #8c4a1e;
      --prose-h3: #a05a18;
      --prose-p: #3d342a;
      --quote-bg: #efe5d1;
      --quote-border: #c48a3f;
      --quote-text: #6b471c;
      --code-bg: #efe5d1;
      --code-border: #decbaf;
      --code-text: #7c4118;
      --table-header: #ede3d1;
      --card-shadow: 0 1px 3px rgba(60,40,20,0.05);
    }

    /* 🌙 Dark Night Theme */
    :root.theme-dark {
      --bg-page: #090d16;
      --bg-surface: #0f172a;
      --bg-sidebar: #0f172a;
      --bg-sidebar-hover: #1e293b;
      --bg-active: #0c4a6e;
      --border-color: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #cbd5e1;
      --text-dim: #94a3b8;
      --prose-h1: #f8fafc;
      --prose-h2: #38bdf8;
      --prose-h3: #fcd34d;
      --prose-p: #cbd5e1;
      --quote-bg: rgba(245, 158, 11, 0.08);
      --quote-border: #f59e0b;
      --quote-text: #fde68a;
      --code-bg: #020617;
      --code-border: #1e293b;
      --code-text: #7dd3fc;
      --table-header: #1e293b;
      --card-shadow: 0 1px 3px rgba(0,0,0,0.3);
    }

    html, body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans SC', sans-serif;
      overflow-x: hidden;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: var(--bg-page);
      color: var(--text-main);
      transition: background-color 0.2s ease, color 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    /* Custom Scrollbar for Sidebar & Content */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* ---------------------------------------------------- */
    /* Master Editorial Prose Typography                    */
    /* ---------------------------------------------------- */
    .prose-custom {
      width: 100%;
      max-width: 100%;
      overflow-wrap: break-word;
      word-wrap: break-word;
      word-break: break-word;
    }
    .prose-custom h1 {
      font-size: clamp(1.35rem, 2.2vw + 0.5rem, 2.15rem);
      font-weight: 800;
      color: var(--prose-h1);
      margin-top: 0.5rem;
      margin-bottom: 1.15rem;
      padding-bottom: 0.65rem;
      border-bottom: 2px solid var(--border-color);
      line-height: 1.35;
      letter-spacing: -0.025em;
    }
    .prose-custom h2 {
      font-size: clamp(1.15rem, 1.6vw + 0.3rem, 1.55rem);
      font-weight: 700;
      color: var(--prose-h2);
      margin-top: 2rem;
      margin-bottom: 0.8rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px dashed var(--border-color);
      line-height: 1.4;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
      scroll-margin-top: 6.5rem;
    }
    .prose-custom h3 {
      font-size: clamp(1rem, 1.2vw + 0.2rem, 1.28rem);
      font-weight: 600;
      color: var(--prose-h3);
      margin-top: 1.5rem;
      margin-bottom: 0.55rem;
      line-height: 1.45;
      scroll-margin-top: 6.5rem;
    }
    .prose-custom p {
      font-size: var(--article-font-size, 0.98rem);
      color: var(--prose-p);
      line-height: 1.85;
      margin-bottom: 1.15rem;
      text-align: justify;
    }
    .prose-custom strong {
      color: var(--text-main);
      font-weight: 700;
    }
    .prose-custom ul, .prose-custom ol {
      font-size: var(--article-font-size, 0.98rem);
      color: var(--prose-p);
      margin-bottom: 1.15rem;
      padding-left: 1.35rem;
      line-height: 1.8;
    }
    .prose-custom ul { list-style-type: disc; }
    .prose-custom ol { list-style-type: decimal; }
    .prose-custom li { margin-bottom: 0.45rem; }
    
    .prose-custom blockquote {
      border-left: 4px solid var(--quote-border);
      background: var(--quote-bg);
      padding: 1rem 1.25rem;
      border-radius: 0 0.75rem 0.75rem 0;
      color: var(--quote-text);
      font-style: italic;
      margin: 1.35rem 0;
      font-size: clamp(0.9rem, 0.9vw + 0.1rem, 1.02rem);
      line-height: 1.75;
      border-top: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      box-shadow: var(--card-shadow);
      position: relative;
    }
    .prose-custom pre {
      background: var(--code-bg);
      border: 1px solid var(--code-border);
      padding: 1rem;
      border-radius: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      overflow-x: auto;
      max-width: 100%;
      color: var(--code-text);
      margin: 1.35rem 0;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-all;
      box-shadow: var(--card-shadow);
    }
    .prose-custom table {
      width: 100%;
      display: block;
      overflow-x: auto;
      border-collapse: collapse;
      font-size: 0.85rem;
      margin: 1.35rem 0;
      border: 1px solid var(--border-color);
      border-radius: 0.75rem;
      background: var(--bg-surface);
      box-shadow: var(--card-shadow);
    }
    .prose-custom th {
      background: var(--table-header);
      color: var(--text-main);
      padding: 0.65rem 0.9rem;
      border-bottom: 1px solid var(--border-color);
      font-weight: 600;
      white-space: nowrap;
    }
    .prose-custom td {
      padding: 0.65rem 0.9rem;
      border-bottom: 1px solid var(--border-color);
      color: var(--text-muted);
    }
    .prose-custom hr {
      border: 0;
      border-top: 1px solid var(--border-color);
      margin: 2rem 0;
    }

    /* Reading Progress Bar */
    #progress-bar {
      transition: width 0.1s ease-out;
    }

    /* TOC Active Indicator */
    .toc-item.active {
      color: var(--prose-h2);
      font-weight: 700;
      border-left: 3px solid var(--prose-h2);
      background-color: var(--bg-sidebar-hover);
    }

    /* Mobile drawer slide transition */
    #sidebar {
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Print styles */
    @media print {
      header, aside, #mobile-backdrop, .no-print { display: none !important; }
      main, #article-scroll-container { overflow: visible !important; height: auto !important; }
      body { background: white !important; color: black !important; }
    }
  </style>
</head>

<body class="h-screen flex flex-col antialiased overflow-hidden selection:bg-sky-500 selection:text-white">

  <!-- Top Reading Progress Indicator -->
  <div class="fixed top-0 left-0 right-0 h-1 bg-transparent z-50 pointer-events-none">
    <div id="progress-bar" class="h-full bg-gradient-to-r from-sky-500 to-indigo-600 w-0"></div>
  </div>

  <!-- -------------------------------------------------- -->
  <!-- TOP UNIFIED HEADER (Responsive & Compact on Phone)  -->
  <!-- -------------------------------------------------- -->
  <header class="bg-[var(--bg-surface)] border-b border-[var(--border-color)] px-3 sm:px-6 py-2 sm:py-2.5 flex items-center justify-between shrink-0 z-40 shadow-xs">
    
    <!-- Left: Mobile Menu Trigger + Brand / Current Active Title -->
    <div class="flex items-center gap-2 sm:gap-3 min-w-0">
      <!-- Mobile Sidebar Toggle (Distinct pill button) -->
      <button onclick="toggleMobileSidebar()" class="lg:hidden flex items-center gap-1 px-2.5 py-1.5 bg-[var(--bg-page)] text-[var(--text-main)] hover:bg-[var(--bg-sidebar-hover)] rounded-lg text-xs font-semibold border border-[var(--border-color)] shrink-0 transition" aria-label="打开企业目录">
        <i data-lucide="menu" class="w-4 h-4 text-sky-600"></i>
        <span>目录</span>
      </button>

      <div class="flex items-center gap-2 min-w-0">
        <div class="w-7 h-7 sm:w-8 sm:h-8 rounded-lg bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center shadow-xs text-white font-black text-xs sm:text-sm shrink-0">
          500
        </div>
        <!-- On Mobile show compact active company, on PC show Global 500 title -->
        <div class="min-w-0 hidden sm:flex items-center gap-2">
          <h1 class="font-extrabold text-sm sm:text-base text-[var(--text-main)] tracking-tight truncate">Global 500 传记智库</h1>
          <span class="text-[10px] font-semibold px-2 py-0.5 bg-sky-50 dark:bg-sky-950/60 text-sky-700 dark:text-sky-400 border border-sky-200 dark:border-sky-800 rounded-full shrink-0">2026</span>
        </div>
        <div class="min-w-0 sm:hidden flex items-center gap-1.5">
          <span id="mobile-header-rank" class="text-[11px] font-bold text-sky-600 bg-sky-50 dark:bg-sky-950 px-1.5 py-0.2 rounded border border-sky-200 dark:border-sky-800 shrink-0">#001</span>
          <span id="mobile-header-title" class="text-xs font-bold text-[var(--text-main)] truncate">亚马逊</span>
        </div>
      </div>
    </div>

    <!-- Right Controls: Theme Switcher, Font size, TOC trigger & GitHub Link -->
    <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
      
      <!-- 🎨 3-Theme Mode Switcher (Light / Sepia / Dark) -->
      <div class="flex items-center gap-0.5 bg-[var(--bg-page)] p-0.5 sm:p-1 rounded-lg sm:rounded-xl border border-[var(--border-color)] text-xs">
        <button onclick="setTheme('light')" id="btn-theme-light" class="p-1 sm:p-1.5 rounded-md sm:rounded-lg text-[var(--text-dim)] hover:text-[var(--text-main)] transition" title="☀️ 极简白">
          <i data-lucide="sun" class="w-3.5 h-3.5"></i>
        </button>
        <button onclick="setTheme('sepia')" id="btn-theme-sepia" class="p-1 sm:p-1.5 rounded-md sm:rounded-lg text-[var(--text-dim)] hover:text-[var(--text-main)] transition" title="📜 羊皮纸护眼">
          <i data-lucide="book-open" class="w-3.5 h-3.5"></i>
        </button>
        <button onclick="setTheme('dark')" id="btn-theme-dark" class="p-1 sm:p-1.5 rounded-md sm:rounded-lg text-[var(--text-dim)] hover:text-[var(--text-main)] transition" title="🌙 深邃暗夜">
          <i data-lucide="moon" class="w-3.5 h-3.5"></i>
        </button>
      </div>

      <!-- Font Size Controller (Desktop only) -->
      <div class="hidden md:flex items-center gap-1 bg-[var(--bg-page)] p-1 rounded-xl border border-[var(--border-color)] text-xs">
        <button onclick="changeFontSize(-1)" class="px-2 py-0.5 text-[var(--text-muted)] hover:text-[var(--text-main)] hover:bg-[var(--bg-surface)] rounded transition font-medium" title="减小字号">A-</button>
        <span class="text-[var(--border-color)]">|</span>
        <button onclick="changeFontSize(1)" class="px-2 py-0.5 text-[var(--text-muted)] hover:text-[var(--text-main)] hover:bg-[var(--bg-surface)] rounded transition font-medium" title="加大字号">A+</button>
      </div>

      <!-- TOC Drawer Button -->
      <button onclick="toggleToc()" id="btn-toc" class="flex items-center gap-1 px-2 py-1.5 sm:px-2.5 sm:py-1.5 bg-amber-50 dark:bg-amber-950/40 hover:bg-amber-100 text-amber-800 dark:text-amber-300 rounded-lg text-xs font-medium border border-amber-200 dark:border-amber-800/60 transition">
        <i data-lucide="list-tree" class="w-3.5 h-3.5"></i>
        <span class="hidden xs:inline">章节</span>
      </button>

      <a href="https://github.com/leon7786/20260828-global500" target="_blank" 
         class="flex items-center gap-1 p-1.5 sm:px-2.5 sm:py-1.5 bg-[var(--bg-page)] hover:bg-[var(--bg-sidebar-hover)] text-[var(--text-main)] rounded-lg text-xs font-medium border border-[var(--border-color)] transition">
        <i data-lucide="github" class="w-3.5 h-3.5"></i>
        <span class="hidden sm:inline">源码</span>
      </a>
    </div>
  </header>

  <!-- Main Split Layout Container -->
  <div class="flex-1 flex overflow-hidden relative">

    <!-- -------------------------------------------------- -->
    <!-- LEFT SIDEBAR: Company Selector & Filters           -->
    <!-- Mobile Width: Max 280px (leaving comfortable space)-->
    <!-- -------------------------------------------------- -->
    <aside id="sidebar" 
           class="fixed inset-y-0 left-0 z-40 w-[80vw] max-w-[285px] sm:w-76 lg:w-80 bg-[var(--bg-sidebar)] border-r border-[var(--border-color)] flex flex-col -translate-x-full lg:translate-x-0 lg:static lg:z-auto shrink-0 shadow-2xl lg:shadow-none">
      
      <!-- Mobile Close Header in Drawer -->
      <div class="lg:hidden p-3 border-b border-[var(--border-color)] flex items-center justify-between bg-[var(--bg-page)]">
        <div class="flex items-center gap-1.5">
          <i data-lucide="building" class="w-4 h-4 text-sky-600"></i>
          <span class="font-bold text-xs text-[var(--text-main)]">选择 500 强企业</span>
        </div>
        <button onclick="toggleMobileSidebar()" class="p-1 text-[var(--text-dim)] hover:text-[var(--text-main)] rounded-md">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- Search & Filters in Sidebar -->
      <div class="p-3 border-b border-[var(--border-color)] bg-[var(--bg-page)] space-y-2">
        <!-- Search Input -->
        <div class="relative">
          <i data-lucide="search" class="w-3.5 h-3.5 text-[var(--text-dim)] absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
          <input type="text" id="search-input" placeholder="搜索企业、创始人..." 
                 class="w-full pl-8 pr-2.5 py-1.5 bg-[var(--bg-surface)] border border-[var(--border-color)] rounded-lg text-xs text-[var(--text-main)] placeholder-[var(--text-dim)] focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 shadow-2xs transition">
        </div>

        <!-- Filter Dropdowns -->
        <div class="grid grid-cols-2 gap-1.5">
          <select id="country-filter" class="bg-[var(--bg-surface)] border border-[var(--border-color)] text-[11px] text-[var(--text-muted)] rounded-lg px-1.5 py-1.5 focus:outline-none focus:border-sky-500">
            <option value="">🌍 国家</option>
            <option value="🇨🇳 中国">🇨🇳 中国</option>
            <option value="🇺🇸 美国">🇺🇸 美国</option>
            <option value="🇩🇪 德国">🇩🇪 德国</option>
            <option value="🇯🇵 日本">🇯🇵 日本</option>
            <option value="🇸🇦 沙特">🇸🇦 沙特</option>
            <option value="🇬🇧 英国">🇬🇧 英国</option>
          </select>

          <select id="industry-filter" class="bg-[var(--bg-surface)] border border-[var(--border-color)] text-[11px] text-[var(--text-muted)] rounded-lg px-1.5 py-1.5 focus:outline-none focus:border-sky-500">
            <option value="">🏢 行业</option>
            <option value="💻 科技与芯片">💻 科技与芯片</option>
            <option value="🛒 零售与电商">🛒 零售与电商</option>
            <option value="🛢️ 石油与能源">🛢️ 石油与能源</option>
            <option value="🏥 医疗与健康">🏥 医疗与健康</option>
            <option value="🚗 汽车与出行">🚗 汽车与出行</option>
            <option value="🏦 金融与银行">🏦 金融与银行</option>
            <option value="🏗️ 建筑与工程">🏗️ 建筑与工程</option>
          </select>
        </div>

        <div class="flex items-center justify-between text-[10px] text-[var(--text-dim)] px-0.5">
          <span id="filtered-count">共 100 家</span>
          <select id="sort-filter" class="bg-transparent text-[10px] text-[var(--text-muted)] focus:outline-none cursor-pointer">
            <option value="rank-asc">按排名 (1-100)</option>
            <option value="size-desc">按篇幅体量</option>
          </select>
        </div>
      </div>

      <!-- Scrollable Company List -->
      <nav id="company-list" class="flex-1 overflow-y-auto p-1.5 space-y-0.5 divide-y divide-[var(--border-color)]/40">
        <!-- List items injected here -->
      </nav>
    </aside>

    <!-- Mobile Backdrop (Tap outside to close drawer) -->
    <div id="mobile-backdrop" onclick="toggleMobileSidebar()" class="fixed inset-0 bg-black/50 backdrop-blur-xs z-30 hidden lg:hidden"></div>

    <!-- -------------------------------------------------- -->
    <!-- RIGHT MAIN CONTENT: Reader & Article View          -->
    <!-- -------------------------------------------------- -->
    <main class="flex-1 flex flex-col bg-[var(--bg-surface)] overflow-hidden relative">
      
      <!-- Right Sub-Header Toolbar (Streamlined & Compact) -->
      <div class="px-3 sm:px-8 py-2 sm:py-2.5 bg-[var(--bg-surface)] border-b border-[var(--border-color)] flex flex-wrap items-center justify-between gap-2 shrink-0 shadow-2xs z-20">
        
        <!-- Desktop Breadcrumb Info -->
        <div class="hidden sm:flex items-center gap-2.5 min-w-0">
          <span id="active-rank" class="px-2 py-0.5 bg-sky-50 dark:bg-sky-950/60 text-sky-700 dark:text-sky-400 border border-sky-200 dark:border-sky-800 text-xs font-bold rounded-md shrink-0">#001</span>
          <div class="min-w-0">
            <div class="flex items-center gap-2">
              <h2 id="active-title" class="font-bold text-sm sm:text-base text-[var(--text-main)] truncate">亚马逊 (Amazon)</h2>
              <span id="active-meta" class="text-xs text-[var(--text-dim)] hidden md:inline">🇺🇸 美国 · 🛒 零售与电商</span>
            </div>
          </div>
        </div>

        <!-- Segmented Tab Controls (Full width on phone, pill group on desktop) -->
        <div class="w-full sm:w-auto flex items-center gap-1 bg-[var(--bg-page)] p-0.5 sm:p-1 rounded-lg sm:rounded-xl border border-[var(--border-color)]">
          <button onclick="switchTab('founder')" id="tab-founder" class="flex-1 sm:flex-initial px-2 sm:px-3 py-1 text-xs font-semibold rounded-md sm:rounded-lg bg-[var(--bg-surface)] text-sky-700 dark:text-sky-400 shadow-xs transition flex items-center justify-center gap-1">
            <i data-lucide="user" class="w-3.5 h-3.5"></i>
            <span>创始人传记</span>
          </button>
          <button onclick="switchTab('company')" id="tab-company" class="flex-1 sm:flex-initial px-2 sm:px-3 py-1 text-xs font-semibold rounded-md sm:rounded-lg text-[var(--text-muted)] hover:text-[var(--text-main)] transition flex items-center justify-center gap-1">
            <i data-lucide="building" class="w-3.5 h-3.5"></i>
            <span>企业档案</span>
          </button>
          <button onclick="switchTab('readme')" id="tab-readme" class="flex-1 sm:flex-initial px-2 sm:px-3 py-1 text-xs font-semibold rounded-md sm:rounded-lg text-[var(--text-muted)] hover:text-[var(--text-main)] transition flex items-center justify-center gap-1">
            <i data-lucide="compass" class="w-3.5 h-3.5"></i>
            <span>专栏总览</span>
          </button>
        </div>
      </div>

      <!-- Main Layout Body: Article + Floating Table of Contents -->
      <div class="flex-1 flex overflow-hidden relative">

        <!-- Scrollable Article Area -->
        <div id="article-scroll-container" class="flex-1 overflow-y-auto px-3.5 py-4 sm:px-8 sm:py-8 lg:px-12 lg:py-10 scroll-smooth" onscroll="handleArticleScroll()">
          <div class="max-w-3.5xl mx-auto">

            <!-- Markdown Content Render Target -->
            <div id="article-content" class="prose-custom">
              <div class="text-center py-20 text-[var(--text-dim)]">
                <i data-lucide="loader" class="w-8 h-8 animate-spin mx-auto mb-3 text-sky-600"></i>
                <p class="text-sm">正在加载全景史诗传记...</p>
              </div>
            </div>

            <!-- Bottom Article Navigation Footer -->
            <div class="mt-12 sm:mt-16 pt-6 sm:pt-8 border-t border-[var(--border-color)] flex items-center justify-between text-xs sm:text-sm text-[var(--text-muted)] no-print">
              <button onclick="navigateCompany(-1)" id="btn-prev" class="flex items-center gap-1 px-2.5 py-1.5 sm:px-3 sm:py-2 rounded-lg hover:bg-[var(--bg-page)] transition">
                <i data-lucide="arrow-left" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
                <span id="prev-title">上一篇</span>
              </button>
              <button onclick="scrollToArticleTop()" class="text-[var(--text-dim)] hover:text-[var(--text-main)] text-xs flex items-center gap-1">
                <i data-lucide="arrow-up" class="w-3.5 h-3.5"></i>
                <span>回到顶部</span>
              </button>
              <button onclick="navigateCompany(1)" id="btn-next" class="flex items-center gap-1 px-2.5 py-1.5 sm:px-3 sm:py-2 rounded-lg hover:bg-[var(--bg-page)] transition text-sky-600 font-semibold">
                <span id="next-title">下一篇</span>
                <i data-lucide="arrow-right" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
              </button>
            </div>

          </div>
        </div>

        <!-- -------------------------------------------------- -->
        <!-- RIGHT OUTLINE / TOC PANEL                          -->
        <!-- -------------------------------------------------- -->
        <aside id="toc-panel" class="hidden xl:block w-72 bg-[var(--bg-page)] border-l border-[var(--border-color)] p-5 overflow-y-auto shrink-0">
          <div class="sticky top-0">
            <h3 class="text-xs font-bold text-[var(--text-main)] uppercase tracking-wider mb-3 flex items-center gap-2">
              <i data-lucide="list" class="w-4 h-4 text-sky-600"></i>
              <span>本文导读目录</span>
            </h3>
            <nav id="toc-list" class="space-y-1 text-xs text-[var(--text-muted)]">
              <!-- TOC Links dynamically parsed -->
            </nav>
          </div>
        </aside>

      </div>

    </main>

  </div>

  <script>
    let allCompanies = [];
    let currentFiltered = [];
    let currentIndex = 0;
    let currentTab = 'founder';
    let currentFontSizeRem = 0.98;
    let currentTheme = localStorage.getItem('global500_theme') || 'light';

    function setTheme(theme) {
      currentTheme = theme;
      localStorage.setItem('global500_theme', theme);
      document.documentElement.className = `theme-${theme}`;
      
      // Update active state on theme buttons
      ['light', 'sepia', 'dark'].forEach(t => {
        const btn = document.getElementById(`btn-theme-${t}`);
        if (t === theme) {
          btn.classList.add('bg-[var(--bg-surface)]', 'text-sky-600', 'shadow-xs', 'font-bold');
        } else {
          btn.classList.remove('bg-[var(--bg-surface)]', 'text-sky-600', 'shadow-xs', 'font-bold');
        }
      });
    }

    function toggleMobileSidebar() {
      const sidebar = document.getElementById('sidebar');
      const backdrop = document.getElementById('mobile-backdrop');
      sidebar.classList.toggle('-translate-x-full');
      backdrop.classList.toggle('hidden');
    }

    function toggleToc() {
      const toc = document.getElementById('toc-panel');
      if (toc.classList.contains('hidden')) {
        toc.classList.remove('hidden');
      } else {
        toc.classList.add('hidden');
      }
    }

    function changeFontSize(delta) {
      currentFontSizeRem = Math.min(Math.max(currentFontSizeRem + delta * 0.08, 0.8), 1.35);
      document.documentElement.style.setProperty('--article-font-size', `${currentFontSizeRem}rem`);
    }

    function scrollToArticleTop() {
      document.getElementById('article-scroll-container').scrollTo({ top: 0, behavior: 'smooth' });
    }

    function handleArticleScroll() {
      const container = document.getElementById('article-scroll-container');
      const scrollTop = container.scrollTop;
      const scrollHeight = container.scrollHeight - container.clientHeight;
      const progress = scrollHeight > 0 ? (scrollTop / scrollHeight) * 100 : 0;
      document.getElementById('progress-bar').style.width = `${progress}%`;

      // Dynamic TOC Scrollspy
      const headers = container.querySelectorAll('h2, h3');
      let activeHeader = null;
      headers.forEach(h => {
        const top = h.offsetTop - container.offsetTop;
        if (scrollTop >= top - 120) {
          activeHeader = h.id;
        }
      });

      if (activeHeader) {
        document.querySelectorAll('.toc-item').forEach(item => {
          if (item.getAttribute('data-target') === activeHeader) {
            item.classList.add('active');
          } else {
            item.classList.remove('active');
          }
        });
      }
    }

    // Load Data
    async function initData() {
      setTheme(currentTheme);
      try {
        const res = await fetch('./site_data.json');
        const data = await res.json();
        allCompanies = data.companies;
        currentFiltered = [...allCompanies];
        
        renderSidebar();
        selectCompany(0); // Default to #001 Amazon
        lucide.createIcons();
      } catch (err) {
        console.error('Failed to load site data', err);
        document.getElementById('article-content').innerHTML = '<p class="text-rose-500 text-center py-20">数据载入失败，请刷新重试。</p>';
      }
    }

    // Render Left Sidebar Items
    function renderSidebar() {
      const listEl = document.getElementById('company-list');
      listEl.innerHTML = '';
      document.getElementById('filtered-count').innerText = `共 ${currentFiltered.length} 家`;

      if (currentFiltered.length === 0) {
        listEl.innerHTML = '<div class="p-6 text-center text-xs text-[var(--text-dim)]">无匹配企业</div>';
        return;
      }

      currentFiltered.forEach((c, idx) => {
        const isMaster = c.founder_size >= 25000;
        const isActive = allCompanies[currentIndex] && allCompanies[currentIndex].rank === c.rank;
        
        const item = document.createElement('button');
        item.className = `w-full text-left p-2 rounded-lg transition flex items-center justify-between group ${
          isActive 
            ? 'bg-[var(--bg-active)] text-sky-900 dark:text-sky-200 border-l-3 border-sky-600 font-semibold shadow-2xs' 
            : 'hover:bg-[var(--bg-sidebar-hover)] text-[var(--text-muted)]'
        }`;
        item.onclick = () => {
          const originalIdx = allCompanies.findIndex(x => x.rank === c.rank);
          selectCompany(originalIdx);
          if (window.innerWidth < 1024) toggleMobileSidebar();
        };

        item.innerHTML = `
          <div class="flex items-center gap-2 min-w-0">
            <span class="text-[10px] font-mono font-bold px-1 py-0.5 rounded ${
              isActive ? 'bg-sky-200/80 dark:bg-sky-900 text-sky-900 dark:text-sky-200' : 'bg-[var(--bg-page)] text-[var(--text-dim)]'
            }">
              #${String(c.rank).padStart(3, '0')}
            </span>
            <div class="min-w-0">
              <div class="text-xs truncate font-medium text-[var(--text-main)]">${c.name_cn}</div>
              <div class="text-[10px] text-[var(--text-dim)] truncate">${c.name_en} · ${c.country.split(' ')[0]}</div>
            </div>
          </div>
          <span class="text-[10px] font-mono text-[var(--text-dim)] shrink-0 ${isMaster ? 'text-amber-600 dark:text-amber-400 font-semibold' : ''}">
            ${c.founder_size_kb}K
          </span>
        `;
        listEl.appendChild(item);
      });
      lucide.createIcons();
    }

    // Select & Load Company Content
    async function selectCompany(index) {
      if (index < 0 || index >= allCompanies.length) return;
      currentIndex = index;
      const c = allCompanies[currentIndex];

      // Update Desktop Sub-Header
      document.getElementById('active-rank').innerText = '#' + String(c.rank).padStart(3, '0');
      document.getElementById('active-title').innerText = `${c.name_cn} (${c.name_en})`;
      document.getElementById('active-meta').innerText = `${c.country} · ${c.industry}`;

      // Update Mobile Top Header Title
      document.getElementById('mobile-header-rank').innerText = '#' + String(c.rank).padStart(3, '0');
      document.getElementById('mobile-header-title').innerText = c.name_cn;

      // Update Navigation Buttons
      const prevBtn = document.getElementById('btn-prev');
      const nextBtn = document.getElementById('btn-next');
      if (currentIndex > 0) {
        prevBtn.classList.remove('invisible');
        document.getElementById('prev-title').innerText = `#${String(allCompanies[currentIndex-1].rank).padStart(3, '0')} ${allCompanies[currentIndex-1].name_cn}`;
      } else {
        prevBtn.classList.add('invisible');
      }

      if (currentIndex < allCompanies.length - 1) {
        nextBtn.classList.remove('invisible');
        document.getElementById('next-title').innerText = `#${String(allCompanies[currentIndex+1].rank).padStart(3, '0')} ${allCompanies[currentIndex+1].name_cn}`;
      } else {
        nextBtn.classList.add('invisible');
      }

      renderSidebar();
      await loadMarkdown(c.folder, currentTab);
      scrollToArticleTop();
    }

    function navigateCompany(step) {
      selectCompany(currentIndex + step);
    }

    // Tab Switcher (Founder / Company / Readme)
    async function switchTab(tab) {
      currentTab = tab;
      ['founder', 'company', 'readme'].forEach(t => {
        const btn = document.getElementById(`tab-${t}`);
        if (t === tab) {
          btn.className = "flex-1 sm:flex-initial px-2 sm:px-3 py-1 text-xs font-semibold rounded-md sm:rounded-lg bg-[var(--bg-surface)] text-sky-700 dark:text-sky-400 shadow-xs transition flex items-center justify-center gap-1";
        } else {
          btn.className = "flex-1 sm:flex-initial px-2 sm:px-3 py-1 text-xs font-semibold rounded-md sm:rounded-lg text-[var(--text-muted)] hover:text-[var(--text-main)] transition flex items-center justify-center gap-1";
        }
      });
      const c = allCompanies[currentIndex];
      if (c) await loadMarkdown(c.folder, tab);
    }

    // Fetch and render Markdown + Generate Dynamic TOC
    async function loadMarkdown(folder, type) {
      const contentEl = document.getElementById('article-content');
      contentEl.innerHTML = `
        <div class="text-center py-20 text-[var(--text-dim)]">
          <i data-lucide="loader" class="w-7 h-7 animate-spin mx-auto mb-2.5 text-sky-600"></i>
          <p class="text-xs text-[var(--text-dim)]">正在加载史料文档...</p>
        </div>
      `;
      lucide.createIcons();

      const fileName = type === 'founder' ? 'founder.md' : (type === 'company' ? 'company.md' : 'README.md');
      try {
        const url = `./Founder/${encodeURIComponent(folder)}/${fileName}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error('File not found');
        const text = await res.text();
        
        // Parse markdown to HTML
        const html = marked.parse(text);
        contentEl.innerHTML = DOMPurify.sanitize(html);

        // Build Dynamic TOC from H2 / H3
        buildTableOfContents(contentEl);
        lucide.createIcons();

      } catch (err) {
        contentEl.innerHTML = `
          <div class="p-8 text-center text-[var(--text-dim)] bg-[var(--bg-page)] rounded-xl border border-[var(--border-color)] my-6">
            <p class="text-rose-500 font-semibold mb-1 text-xs sm:text-sm">无法载入 ${fileName}</p>
            <p class="text-[11px] text-[var(--text-dim)]">请确认文件路径与网络连接。</p>
          </div>
        `;
      }
    }

    function buildTableOfContents(container) {
      const tocList = document.getElementById('toc-list');
      tocList.innerHTML = '';
      const headers = container.querySelectorAll('h2, h3');

      if (headers.length === 0) {
        tocList.innerHTML = '<p class="text-[var(--text-dim)] text-xs">暂无章节标题</p>';
        return;
      }

      headers.forEach((h, i) => {
        const id = 'sec-' + i;
        h.id = id;
        const text = h.innerText.replace(/^[0-9🎬🧭🏬🌪️🛡️🧠🥣💬📅\.\s]+/, '').trim() || h.innerText;
        const isH2 = h.tagName === 'H2';

        const a = document.createElement('a');
        a.href = '#' + id;
        a.setAttribute('data-target', id);
        a.className = `toc-item block py-1.5 px-2.5 rounded-lg transition truncate ${
          isH2 
            ? 'font-bold text-[var(--text-main)] hover:text-sky-600 hover:bg-[var(--bg-sidebar-hover)]' 
            : 'pl-4 text-[var(--text-dim)] hover:text-[var(--text-main)] hover:bg-[var(--bg-sidebar-hover)]'
        }`;
        a.innerText = text;
        a.onclick = (e) => {
          e.preventDefault();
          h.scrollIntoView({ behavior: 'smooth' });
        };
        tocList.appendChild(a);
      });
    }

    // Filter Logic
    function applyFilters() {
      const q = document.getElementById('search-input').value.toLowerCase().trim();
      const country = document.getElementById('country-filter').value;
      const industry = document.getElementById('industry-filter').value;
      const sort = document.getElementById('sort-filter').value;

      currentFiltered = allCompanies.filter(c => {
        const matchQ = !q || c.name_cn.toLowerCase().includes(q) || c.name_en.toLowerCase().includes(q) || c.founder_title.toLowerCase().includes(q) || String(c.rank).includes(q);
        const matchCountry = !country || c.country === country;
        const matchIndustry = !industry || c.industry === industry;
        return matchQ && matchCountry && matchIndustry;
      });

      if (sort === 'size-desc') {
        currentFiltered.sort((a, b) => b.founder_size - a.founder_size);
      } else {
        currentFiltered.sort((a, b) => a.rank - b.rank);
      }

      renderSidebar();
    }

    document.getElementById('search-input').addEventListener('input', applyFilters);
    document.getElementById('country-filter').addEventListener('change', applyFilters);
    document.getElementById('industry-filter').addEventListener('change', applyFilters);
    document.getElementById('sort-filter').addEventListener('change', applyFilters);

    initData();
  </script>
</body>
</html>

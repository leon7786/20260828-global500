<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>世界 500 强创始人全景史诗传记智库 | Fortune Global 500</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          screens: {
            'xs': '375px',
            'sm': '640px',
            'md': '768px',
            'ipad': '834px',
            'lg': '1024px',
            'xl': '1280px',
            '2xl': '1536px',
          },
          colors: {
            brand: {
              50: '#f0f7ff',
              100: '#e0effe',
              500: '#0284c7',
              600: '#0369a1',
              900: '#0c4a6e',
            },
            dark: {
              800: '#1e293b',
              850: '#172033',
              900: '#0f172a',
              950: '#020617',
            }
          }
        }
      }
    }
  </script>

  <!-- Marked Markdown Parser & DOMPurify & Mermaid.js -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap');
    
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans SC', sans-serif;
      overflow-x: hidden;
      width: 100%;
      max-width: 100vw;
      margin: 0;
      padding: 0;
      background-color: #020617;
      color: #f8fafc;
      -webkit-tap-highlight-color: transparent;
    }

    /* Safe Area insets for iPhone / iPad Home bar and notch */
    .safe-top {
      padding-top: env(safe-area-inset-top, 0px);
    }
    .safe-bottom {
      padding-bottom: env(safe-area-inset-bottom, 16px);
    }

    /* ---------------------------------------------------- */
    /* Markdown Reader Responsive Typography & Containment   */
    /* ---------------------------------------------------- */
    .prose-custom {
      width: 100%;
      max-width: 100%;
      overflow-wrap: break-word;
      word-wrap: break-word;
      word-break: break-word;
    }
    .prose-custom h1 {
      font-size: clamp(1.25rem, 2.5vw + 0.5rem, 1.85rem);
      font-weight: 800;
      color: #f8fafc;
      margin-top: 1.5rem;
      margin-bottom: 0.75rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid rgba(51, 65, 85, 0.6);
      line-height: 1.3;
    }
    .prose-custom h2 {
      font-size: clamp(1.1rem, 2vw + 0.3rem, 1.45rem);
      font-weight: 700;
      color: #38bdf8;
      margin-top: 1.5rem;
      margin-bottom: 0.6rem;
      line-height: 1.35;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
    }
    .prose-custom h3 {
      font-size: clamp(0.95rem, 1.5vw + 0.2rem, 1.2rem);
      font-weight: 600;
      color: #fcd34d;
      margin-top: 1.25rem;
      margin-bottom: 0.4rem;
      line-height: 1.4;
    }
    .prose-custom p {
      font-size: clamp(0.85rem, 1vw + 0.15rem, 0.95rem);
      color: #cbd5e1;
      line-height: 1.7;
      margin-bottom: 0.85rem;
    }
    .prose-custom ul, .prose-custom ol {
      font-size: clamp(0.85rem, 1vw + 0.15rem, 0.95rem);
      color: #cbd5e1;
      margin-bottom: 0.85rem;
      padding-left: 1.25rem;
      line-height: 1.65;
    }
    .prose-custom ul { list-style-type: disc; }
    .prose-custom ol { list-style-type: decimal; }
    .prose-custom li { margin-bottom: 0.35rem; }
    .prose-custom blockquote {
      border-left: 4px solid #f59e0b;
      background: rgba(245, 158, 11, 0.08);
      padding: 0.75rem 1rem;
      border-radius: 0 0.5rem 0.5rem 0;
      color: #fde68a;
      font-style: italic;
      margin: 1rem 0;
      font-size: clamp(0.82rem, 1vw + 0.1rem, 0.92rem);
      line-height: 1.6;
    }
    .prose-custom pre {
      background: rgba(2, 6, 23, 0.95);
      border: 1px solid #1e293b;
      padding: 0.85rem;
      border-radius: 0.75rem;
      font-size: clamp(0.72rem, 0.9vw + 0.1rem, 0.82rem);
      overflow-x: auto;
      max-width: 100%;
      color: #7dd3fc;
      margin: 1rem 0;
      white-space: pre-wrap;       /* Wrap on narrow screens */
      word-break: break-all;
    }
    .prose-custom table {
      width: 100%;
      display: block;
      overflow-x: auto;
      border-collapse: collapse;
      font-size: clamp(0.75rem, 1vw, 0.85rem);
      margin: 1rem 0;
      border: 1px solid #1e293b;
      border-radius: 0.5rem;
    }
    .prose-custom th {
      background: rgba(30, 41, 59, 0.9);
      color: #f1f5f9;
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid #334155;
      font-weight: 600;
      white-space: nowrap;
    }
    .prose-custom td {
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid #1e293b;
      color: #cbd5e1;
    }
    .prose-custom hr {
      border: 0;
      border-top: 1px solid #1e293b;
      margin: 1.5rem 0;
    }

    /* ---------------------------------------------------- */
    /* CSS Media Queries for Fine-Grained Device Tuning     */
    /* ---------------------------------------------------- */
    
    /* 📱 Mobile Phones (< 640px) */
    @media (max-width: 639px) {
      .header-title { font-size: 0.95rem; }
      .hero-stat-card { padding: 0.75rem; }
      .hero-stat-val { font-size: 1.15rem; }
      .filter-select { width: 100%; }
      .card-item { padding: 1rem; }
      .reader-dialog {
        width: 100vw !important;
        height: 100vh !important;
        max-height: 100vh !important;
        border-radius: 0 !important;
        border: none !important;
      }
      .tab-btn {
        padding: 0.35rem 0.5rem !important;
        font-size: 0.7rem !important;
      }
    }

    /* 📟 iPad / Tablets Portrait & Landscape (640px to 1024px) */
    @media (min-width: 640px) and (max-width: 1024px) {
      .hero-stat-val { font-size: 1.35rem; }
      .reader-dialog {
        width: 94vw;
        height: 90vh;
        border-radius: 1rem;
      }
      .tab-btn {
        padding: 0.4rem 0.75rem;
        font-size: 0.75rem;
      }
    }

    /* 💻 PC / Laptop (> 1024px) */
    @media (min-width: 1025px) {
      .reader-dialog {
        width: 85vw;
        max-width: 1080px;
        height: 88vh;
        border-radius: 1.25rem;
      }
    }

    /* Mermaid diagrams container auto scroll */
    .mermaid-container {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin: 1rem 0;
      padding: 1rem;
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 0.75rem;
      text-align: center;
    }
  </style>
</head>

  <script>
    let allCompanies = [];
    let currentFolder = '';
    let currentTab = 'founder';

    mermaid.initialize({ startOnLoad: false, theme: 'dark' });

    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Fetch site data
    async function initData() {
      try {
        const res = await fetch('./site_data.json');
        const data = await res.json();
        allCompanies = data.companies;
        document.getElementById('stat-total-companies').innerText = data.total_companies;
        document.getElementById('stat-master-count').innerText = data.master_count + ' 篇';
        document.getElementById('stat-total-bytes').innerText = (data.total_bytes / (1024 * 1024)).toFixed(2) + ' MB';
        
        renderGrid(allCompanies);
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('company-grid').classList.remove('hidden');
        lucide.createIcons();
      } catch (err) {
        console.error('Failed to load data', err);
        document.getElementById('loading').innerHTML = '<p class="text-rose-400 text-xs sm:text-sm">数据加载失败，请刷新重试。</p>';
      }
    }

    function renderGrid(list) {
      const grid = document.getElementById('company-grid');
      const empty = document.getElementById('empty-state');
      grid.innerHTML = '';

      if (list.length === 0) {
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');

      list.forEach(c => {
        const isMaster = c.founder_size >= 25000;
        const card = document.createElement('div');
        card.className = "card-item bg-dark-900/90 border border-slate-800/90 hover:border-sky-500/50 rounded-xl sm:rounded-2xl p-4 sm:p-5 transition duration-200 hover:shadow-xl hover:shadow-sky-500/5 flex flex-col justify-between group cursor-pointer";
        card.onclick = () => openReader(c.folder, c.rank, `${c.name_cn} (${c.name_en})`);

        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between gap-1.5 mb-2.5">
              <span class="font-extrabold text-xs px-2 py-0.5 rounded-md sm:rounded-lg ${isMaster ? 'bg-amber-500/20 text-amber-300 border border-amber-500/30' : 'bg-slate-800 text-slate-300'}">
                #${String(c.rank).padStart(3, '0')}
              </span>
              <div class="flex items-center gap-1.5 text-[11px] sm:text-xs">
                <span class="text-slate-400">${c.country}</span>
                <span class="px-1.5 py-0.2 sm:px-2 sm:py-0.5 bg-slate-800/80 text-slate-300 rounded border border-slate-700/50">${c.industry}</span>
              </div>
            </div>

            <h3 class="text-sm sm:text-base font-bold text-white group-hover:text-sky-400 transition flex items-center justify-between gap-2">
              <span class="truncate">${c.name_cn}</span>
              <span class="text-[11px] sm:text-xs font-normal text-slate-400 truncate shrink-0">${c.name_en}</span>
            </h3>

            <p class="text-[11px] sm:text-xs text-slate-400 mt-2 line-clamp-2 italic bg-slate-950/60 p-2 rounded-lg border border-slate-800/50">
              "${c.founder_quote || '暂无引言摘要...'}"
            </p>
          </div>

          <div class="mt-3.5 pt-2.5 border-t border-slate-800/60 flex items-center justify-between text-[11px] sm:text-xs">
            <span class="px-1.5 py-0.2 sm:px-2 sm:py-0.5 rounded ${isMaster ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-semibold' : 'bg-slate-800 text-slate-400'}">
              ${c.status}
            </span>
            <span class="font-mono text-slate-400 text-[11px] sm:text-xs">${c.founder_size_kb} KB</span>
          </div>
        `;
        grid.appendChild(card);
      });
      lucide.createIcons();
    }

    // Filter Logic
    function applyFilters() {
      const q = document.getElementById('search-input').value.toLowerCase().trim();
      const country = document.getElementById('country-filter').value;
      const industry = document.getElementById('industry-filter').value;
      const sort = document.getElementById('sort-filter').value;

      let filtered = allCompanies.filter(c => {
        const matchQ = !q || c.name_cn.toLowerCase().includes(q) || c.name_en.toLowerCase().includes(q) || c.founder_title.toLowerCase().includes(q) || String(c.rank).includes(q);
        const matchCountry = !country || c.country === country;
        const matchIndustry = !industry || c.industry === industry;
        return matchQ && matchCountry && matchIndustry;
      });

      if (sort === 'size-desc') {
        filtered.sort((a, b) => b.founder_size - a.founder_size);
      } else {
        filtered.sort((a, b) => a.rank - b.rank);
      }

      renderGrid(filtered);
    }

    document.getElementById('search-input').addEventListener('input', applyFilters);
    document.getElementById('country-filter').addEventListener('change', applyFilters);
    document.getElementById('industry-filter').addEventListener('change', applyFilters);
    document.getElementById('sort-filter').addEventListener('change', applyFilters);

    // Open Reader Modal
    async function openReader(folder, rank, name) {
      currentFolder = folder;
      currentTab = 'founder';
      document.getElementById('modal-rank').innerText = '#' + String(rank).padStart(3, '0');
      document.getElementById('modal-title').innerText = name;
      document.getElementById('reader-modal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
      await loadMarkdown(folder, 'founder');
    }

    function closeReader() {
      document.getElementById('reader-modal').classList.add('hidden');
      document.body.style.overflow = 'auto';
    }

    async function switchTab(tab) {
      currentTab = tab;
      ['founder', 'company', 'readme'].forEach(t => {
        const btn = document.getElementById(`tab-${t}`);
        if (t === tab) {
          btn.className = "tab-btn px-2 sm:px-3 py-1 text-[11px] sm:text-xs font-semibold rounded-md sm:rounded-lg bg-sky-600 text-white transition";
        } else {
          btn.className = "tab-btn px-2 sm:px-3 py-1 text-[11px] sm:text-xs font-semibold rounded-md sm:rounded-lg text-slate-400 hover:text-slate-200 transition";
        }
      });
      await loadMarkdown(currentFolder, tab);
    }

    async function loadMarkdown(folder, type) {
      const modalContent = document.getElementById('modal-content');
      modalContent.innerHTML = '<div class="text-center py-16 sm:py-20 text-slate-400 text-xs sm:text-sm"><i data-lucide="loader" class="w-5 h-5 sm:w-6 sm:h-6 animate-spin mx-auto mb-2 text-sky-500"></i>正在读取 Markdown 史料...</div>';
      lucide.createIcons();

      const fileName = type === 'founder' ? 'founder.md' : (type === 'company' ? 'company.md' : 'README.md');
      try {
        const url = `./Founder/${encodeURIComponent(folder)}/${fileName}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error('File not found');
        const text = await res.text();
        
        // Parse markdown
        const html = marked.parse(text);
        modalContent.innerHTML = DOMPurify.sanitize(html);

        // Render Mermaid Diagrams with responsive wrapper
        modalContent.querySelectorAll('pre code.language-mermaid').forEach(async (el) => {
          const graphDefinition = el.innerText;
          const container = document.createElement('div');
          container.className = 'mermaid-container mermaid';
          container.innerHTML = graphDefinition;
          el.parentElement.replaceWith(container);
        });
        await mermaid.run();

      } catch (err) {
        modalContent.innerHTML = `<div class="p-6 sm:p-8 text-center text-slate-400"><p class="text-rose-400 mb-1 text-xs sm:text-sm">无法加载 ${fileName}</p><p class="text-[11px] sm:text-xs">请确认文件路径与网络连接。</p></div>`;
      }
    }

    // Keyboard support: Escape to close modal
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeReader();
    });

    initData();
  </script>
</body>
</html>

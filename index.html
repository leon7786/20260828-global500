<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>世界 500 强创始人全景史诗传记智库 | Fortune Global 500</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          screens: {
            'xs': '375px',
            'sm': '640px',
            'md': '768px',
            'lg': '1024px',
            'xl': '1280px',
            '2xl': '1536px',
          },
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e',
            }
          }
        }
      }
    }
  </script>

  <!-- Marked Markdown Parser & DOMPurify -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap');
    
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans SC', sans-serif;
      overflow-x: hidden;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #f8fafc;
      color: #0f172a;
      -webkit-tap-highlight-color: transparent;
    }

    /* Custom Scrollbar for Sidebar & Content */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* ---------------------------------------------------- */
    /* Light Mode Markdown Reader Typography               */
    /* ---------------------------------------------------- */
    .prose-custom {
      width: 100%;
      max-width: 100%;
      overflow-wrap: break-word;
      word-wrap: break-word;
      word-break: break-word;
    }
    .prose-custom h1 {
      font-size: clamp(1.35rem, 2.2vw + 0.5rem, 1.95rem);
      font-weight: 800;
      color: #0f172a;
      margin-top: 1.5rem;
      margin-bottom: 0.85rem;
      padding-bottom: 0.6rem;
      border-bottom: 1.5px solid #e2e8f0;
      line-height: 1.35;
      letter-spacing: -0.02em;
    }
    .prose-custom h2 {
      font-size: clamp(1.15rem, 1.8vw + 0.3rem, 1.5rem);
      font-weight: 700;
      color: #0369a1;
      margin-top: 2rem;
      margin-bottom: 0.75rem;
      padding-bottom: 0.35rem;
      border-bottom: 1px dashed #e2e8f0;
      line-height: 1.4;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
    }
    .prose-custom h3 {
      font-size: clamp(1rem, 1.3vw + 0.2rem, 1.25rem);
      font-weight: 600;
      color: #b45309;
      margin-top: 1.5rem;
      margin-bottom: 0.5rem;
      line-height: 1.45;
    }
    .prose-custom p {
      font-size: clamp(0.9rem, 0.9vw + 0.15rem, 1rem);
      color: #334155;
      line-height: 1.8;
      margin-bottom: 1rem;
    }
    .prose-custom ul, .prose-custom ol {
      font-size: clamp(0.9rem, 0.9vw + 0.15rem, 1rem);
      color: #334155;
      margin-bottom: 1rem;
      padding-left: 1.5rem;
      line-height: 1.75;
    }
    .prose-custom ul { list-style-type: disc; }
    .prose-custom ol { list-style-type: decimal; }
    .prose-custom li { margin-bottom: 0.4rem; }
    .prose-custom blockquote {
      border-left: 4px solid #f59e0b;
      background: #fffbeb;
      padding: 1rem 1.25rem;
      border-radius: 0 0.75rem 0.75rem 0;
      color: #92400e;
      font-style: italic;
      margin: 1.25rem 0;
      font-size: clamp(0.88rem, 0.9vw + 0.1rem, 0.98rem);
      line-height: 1.7;
      border-top: 1px solid #fef3c7;
      border-right: 1px solid #fef3c7;
      border-bottom: 1px solid #fef3c7;
      box-shadow: 0 1px 2px rgba(245, 158, 11, 0.05);
    }
    .prose-custom pre {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 1rem;
      border-radius: 0.75rem;
      font-size: clamp(0.75rem, 0.85vw + 0.1rem, 0.85rem);
      overflow-x: auto;
      max-width: 100%;
      color: #0369a1;
      margin: 1.25rem 0;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .prose-custom table {
      width: 100%;
      display: block;
      overflow-x: auto;
      border-collapse: collapse;
      font-size: clamp(0.8rem, 0.9vw, 0.9rem);
      margin: 1.25rem 0;
      border: 1px solid #e2e8f0;
      border-radius: 0.5rem;
      background: #ffffff;
    }
    .prose-custom th {
      background: #f1f5f9;
      color: #0f172a;
      padding: 0.65rem 0.9rem;
      border-bottom: 1px solid #cbd5e1;
      font-weight: 600;
      white-space: nowrap;
    }
    .prose-custom td {
      padding: 0.65rem 0.9rem;
      border-bottom: 1px solid #f1f5f9;
      color: #334155;
    }
    .prose-custom hr {
      border: 0;
      border-top: 1px solid #e2e8f0;
      margin: 2rem 0;
    }
  </style>
</head>

<body class="bg-slate-50 text-slate-900 h-screen flex flex-col antialiased overflow-hidden selection:bg-sky-500 selection:text-white">

  <!-- Top Global Bar -->
  <header class="h-14 bg-white border-b border-slate-200 px-4 lg:px-6 flex items-center justify-between shrink-0 z-30 shadow-xs">
    <div class="flex items-center gap-3">
      <!-- Mobile Sidebar Toggle -->
      <button onclick="toggleMobileSidebar()" class="lg:hidden p-2 -ml-1 text-slate-600 hover:text-slate-900 rounded-lg hover:bg-slate-100 transition" aria-label="打开目录">
        <i data-lucide="menu" class="w-5 h-5"></i>
      </button>

      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center shadow-xs text-white font-black text-sm">
          500
        </div>
        <div class="flex items-center gap-2">
          <h1 class="font-extrabold text-sm sm:text-base text-slate-900 tracking-tight">Global 500 传记智库</h1>
          <span class="text-[10px] sm:text-xs font-semibold px-2 py-0.5 bg-sky-50 text-sky-700 border border-sky-200 rounded-full">2026 Edition</span>
        </div>
      </div>
    </div>

    <!-- Quick Actions -->
    <div class="flex items-center gap-2">
      <div class="hidden md:flex items-center gap-3 text-xs text-slate-500 mr-2">
        <span>已收录 <b>100</b> 家巨头</span>
        <span class="text-slate-300">|</span>
        <span><b>1.96 MB</b> 纯文本</span>
      </div>
      <a href="https://github.com/leon7786/20260828-global500" target="_blank" 
         class="flex items-center gap-1.5 px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-medium border border-slate-200 transition">
        <i data-lucide="github" class="w-3.5 h-3.5"></i>
        <span class="hidden sm:inline">GitHub</span>
      </a>
    </div>
  </header>

  <!-- Main Split Layout Container -->
  <div class="flex-1 flex overflow-hidden relative">

    <!-- -------------------------------------------------- -->
    <!-- LEFT SIDEBAR: Company Selector & Filters           -->
    <!-- -------------------------------------------------- -->
    <aside id="sidebar" 
           class="fixed inset-y-0 left-0 z-40 w-80 sm:w-88 bg-white border-r border-slate-200 flex flex-col transition-transform duration-300 -translate-x-full lg:translate-x-0 lg:static lg:z-auto shrink-0 shadow-xl lg:shadow-none">
      
      <!-- Mobile Close Bar -->
      <div class="lg:hidden p-3 border-b border-slate-100 flex items-center justify-between bg-slate-50">
        <span class="font-bold text-xs text-slate-700">选择 500 强企业</span>
        <button onclick="toggleMobileSidebar()" class="p-1.5 text-slate-400 hover:text-slate-700 rounded-md">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- Search & Filters in Sidebar -->
      <div class="p-3.5 border-b border-slate-200 bg-slate-50/70 space-y-2.5">
        <!-- Search Input -->
        <div class="relative">
          <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
          <input type="text" id="search-input" placeholder="搜索企业、创始人、行业..." 
                 class="w-full pl-9 pr-3 py-1.5 bg-white border border-slate-200 rounded-lg text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 shadow-2xs transition">
        </div>

        <!-- Filter Dropdowns -->
        <div class="grid grid-cols-2 gap-1.5">
          <select id="country-filter" class="bg-white border border-slate-200 text-[11px] text-slate-700 rounded-lg px-2 py-1.5 focus:outline-none focus:border-sky-500">
            <option value="">🌍 全部国家</option>
            <option value="🇨🇳 中国">🇨🇳 中国</option>
            <option value="🇺🇸 美国">🇺🇸 美国</option>
            <option value="🇩🇪 德国">🇩🇪 德国</option>
            <option value="🇯🇵 日本">🇯🇵 日本</option>
            <option value="🇸🇦 沙特">🇸🇦 沙特</option>
            <option value="🇬🇧 英国">🇬🇧 英国</option>
          </select>

          <select id="industry-filter" class="bg-white border border-slate-200 text-[11px] text-slate-700 rounded-lg px-2 py-1.5 focus:outline-none focus:border-sky-500">
            <option value="">🏢 全部行业</option>
            <option value="💻 科技与芯片">💻 科技与芯片</option>
            <option value="🛒 零售与电商">🛒 零售与电商</option>
            <option value="🛢️ 石油与能源">🛢️ 石油与能源</option>
            <option value="🏥 医疗与健康">🏥 医疗与健康</option>
            <option value="🚗 汽车与出行">🚗 汽车与出行</option>
            <option value="🏦 金融与银行">🏦 金融与银行</option>
            <option value="🏗️ 建筑与工程">🏗️ 建筑与工程</option>
          </select>
        </div>

        <div class="flex items-center justify-between text-[11px] text-slate-500 px-0.5">
          <span id="filtered-count">共 100 家企业</span>
          <select id="sort-filter" class="bg-transparent text-[11px] text-slate-600 focus:outline-none cursor-pointer">
            <option value="rank-asc">按排名 (1-100)</option>
            <option value="size-desc">按字数体量</option>
          </select>
        </div>
      </div>

      <!-- Scrollable Company List -->
      <nav id="company-list" class="flex-1 overflow-y-auto p-2 space-y-1 divide-y divide-slate-100">
        <!-- List items injected here -->
      </nav>
    </aside>

    <!-- Mobile Backdrop -->
    <div id="mobile-backdrop" onclick="toggleMobileSidebar()" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-30 hidden lg:hidden"></div>

    <!-- -------------------------------------------------- -->
    <!-- RIGHT MAIN CONTENT: Reader & Article View          -->
    <!-- -------------------------------------------------- -->
    <main class="flex-1 flex flex-col bg-white overflow-hidden">
      
      <!-- Right Sub-Header Toolbar -->
      <div class="px-4 sm:px-8 py-3 bg-white border-b border-slate-200 flex flex-wrap items-center justify-between gap-3 shrink-0 shadow-2xs">
        <div class="flex items-center gap-3 min-w-0">
          <span id="active-rank" class="px-2.5 py-1 bg-sky-50 text-sky-700 border border-sky-200 text-xs font-bold rounded-lg shrink-0">#001</span>
          <div class="min-w-0">
            <div class="flex items-center gap-2">
              <h2 id="active-title" class="font-bold text-sm sm:text-base text-slate-900 truncate">亚马逊 (Amazon)</h2>
              <span id="active-meta" class="text-xs text-slate-500 hidden sm:inline">🇺🇸 美国 · 🛒 零售与电商</span>
            </div>
          </div>
        </div>

        <!-- Tab Controls (Founder / Company / Readme) -->
        <div class="flex items-center gap-1 bg-slate-100 p-1 rounded-xl">
          <button onclick="switchTab('founder')" id="tab-founder" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-white text-sky-700 shadow-xs transition flex items-center gap-1.5">
            <i data-lucide="user" class="w-3.5 h-3.5"></i>
            <span>创始人史诗传记</span>
          </button>
          <button onclick="switchTab('company')" id="tab-company" class="px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-600 hover:text-slate-900 transition flex items-center gap-1.5">
            <i data-lucide="building" class="w-3.5 h-3.5"></i>
            <span>企业档案</span>
          </button>
          <button onclick="switchTab('readme')" id="tab-readme" class="px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-600 hover:text-slate-900 transition flex items-center gap-1.5">
            <i data-lucide="compass" class="w-3.5 h-3.5"></i>
            <span>专栏总览</span>
          </button>
        </div>
      </div>

      <!-- Main Scrollable Article Body -->
      <div id="article-scroll-container" class="flex-1 overflow-y-auto p-4 sm:p-8 lg:p-12">
        <div class="max-w-4xl mx-auto">
          
          <div id="article-content" class="prose-custom">
            <!-- Markdown content will be dynamically loaded here -->
            <div class="text-center py-24 text-slate-400">
              <i data-lucide="loader" class="w-8 h-8 animate-spin mx-auto mb-3 text-sky-600"></i>
              <p class="text-sm">正在加载全景史诗传记...</p>
            </div>
          </div>

          <!-- Bottom Article Navigation Footer -->
          <div class="mt-16 pt-8 border-t border-slate-200 flex items-center justify-between text-xs sm:text-sm text-slate-600">
            <button onclick="navigateCompany(-1)" id="btn-prev" class="flex items-center gap-1.5 px-3 py-2 rounded-lg hover:bg-slate-100 transition">
              <i data-lucide="arrow-left" class="w-4 h-4"></i>
              <span id="prev-title">上一篇</span>
            </button>
            <span class="text-slate-400 text-xs font-mono">100 Enterprises Hub</span>
            <button onclick="navigateCompany(1)" id="btn-next" class="flex items-center gap-1.5 px-3 py-2 rounded-lg hover:bg-slate-100 transition text-sky-600 font-semibold">
              <span id="next-title">下一篇</span>
              <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
          </div>

        </div>
      </div>

    </main>

  </div>

  <script>
    let allCompanies = [];
    let currentFiltered = [];
    let currentIndex = 0;
    let currentTab = 'founder';

    function toggleMobileSidebar() {
      const sidebar = document.getElementById('sidebar');
      const backdrop = document.getElementById('mobile-backdrop');
      sidebar.classList.toggle('-translate-x-full');
      backdrop.classList.toggle('hidden');
    }

    // Load Data
    async function initData() {
      try {
        const res = await fetch('./site_data.json');
        const data = await res.json();
        allCompanies = data.companies;
        currentFiltered = [...allCompanies];
        
        renderSidebar();
        selectCompany(0); // Default to #001 Amazon
        lucide.createIcons();
      } catch (err) {
        console.error('Failed to load site data', err);
        document.getElementById('article-content').innerHTML = '<p class="text-rose-500 text-center py-20">数据载入失败，请刷新重试。</p>';
      }
    }

    // Render Left Sidebar Items
    function renderSidebar() {
      const listEl = document.getElementById('company-list');
      listEl.innerHTML = '';
      document.getElementById('filtered-count').innerText = `共 ${currentFiltered.length} 家企业`;

      if (currentFiltered.length === 0) {
        listEl.innerHTML = '<div class="p-6 text-center text-xs text-slate-400">无匹配企业</div>';
        return;
      }

      currentFiltered.forEach((c, idx) => {
        const isMaster = c.founder_size >= 25000;
        const isActive = allCompanies[currentIndex] && allCompanies[currentIndex].rank === c.rank;
        
        const item = document.createElement('button');
        item.className = `w-full text-left p-2.5 rounded-xl transition flex items-center justify-between group ${
          isActive 
            ? 'bg-sky-50 text-sky-900 border-l-4 border-sky-600 font-semibold shadow-2xs' 
            : 'hover:bg-slate-100 text-slate-700'
        }`;
        item.onclick = () => {
          const originalIdx = allCompanies.findIndex(x => x.rank === c.rank);
          selectCompany(originalIdx);
          if (window.innerWidth < 1024) toggleMobileSidebar();
        };

        item.innerHTML = `
          <div class="flex items-center gap-2 min-w-0">
            <span class="text-[11px] font-mono font-bold px-1.5 py-0.5 rounded ${
              isActive ? 'bg-sky-200/70 text-sky-800' : 'bg-slate-100 text-slate-500'
            }">
              #${String(c.rank).padStart(3, '0')}
            </span>
            <div class="min-w-0">
              <div class="text-xs truncate font-medium text-slate-900">${c.name_cn}</div>
              <div class="text-[10px] text-slate-400 truncate">${c.name_en} · ${c.country.split(' ')[0]}</div>
            </div>
          </div>
          <span class="text-[10px] font-mono text-slate-400 shrink-0 ${isMaster ? 'text-amber-600 font-semibold' : ''}">
            ${c.founder_size_kb}K
          </span>
        `;
        listEl.appendChild(item);
      });
      lucide.createIcons();
    }

    // Select & Load Company Content
    async function selectCompany(index) {
      if (index < 0 || index >= allCompanies.length) return;
      currentIndex = index;
      const c = allCompanies[currentIndex];

      document.getElementById('active-rank').innerText = '#' + String(c.rank).padStart(3, '0');
      document.getElementById('active-title').innerText = `${c.name_cn} (${c.name_en})`;
      document.getElementById('active-meta').innerText = `${c.country} · ${c.industry}`;

      // Update Navigation Buttons
      const prevBtn = document.getElementById('btn-prev');
      const nextBtn = document.getElementById('btn-next');
      if (currentIndex > 0) {
        prevBtn.classList.remove('invisible');
        document.getElementById('prev-title').innerText = `#${String(allCompanies[currentIndex-1].rank).padStart(3, '0')} ${allCompanies[currentIndex-1].name_cn}`;
      } else {
        prevBtn.classList.add('invisible');
      }

      if (currentIndex < allCompanies.length - 1) {
        nextBtn.classList.remove('invisible');
        document.getElementById('next-title').innerText = `#${String(allCompanies[currentIndex+1].rank).padStart(3, '0')} ${allCompanies[currentIndex+1].name_cn}`;
      } else {
        nextBtn.classList.add('invisible');
      }

      renderSidebar();
      await loadMarkdown(c.folder, currentTab);
      document.getElementById('article-scroll-container').scrollTo({ top: 0, behavior: 'smooth' });
    }

    function navigateCompany(step) {
      selectCompany(currentIndex + step);
    }

    // Tab Switcher (Founder / Company / Readme)
    async function switchTab(tab) {
      currentTab = tab;
      ['founder', 'company', 'readme'].forEach(t => {
        const btn = document.getElementById(`tab-${t}`);
        if (t === tab) {
          btn.className = "px-3 py-1.5 text-xs font-semibold rounded-lg bg-white text-sky-700 shadow-xs transition flex items-center gap-1.5";
        } else {
          btn.className = "px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-600 hover:text-slate-900 transition flex items-center gap-1.5";
        }
      });
      const c = allCompanies[currentIndex];
      if (c) await loadMarkdown(c.folder, tab);
    }

    // Fetch and render Markdown
    async function loadMarkdown(folder, type) {
      const contentEl = document.getElementById('article-content');
      contentEl.innerHTML = `
        <div class="text-center py-24 text-slate-400">
          <i data-lucide="loader" class="w-8 h-8 animate-spin mx-auto mb-3 text-sky-600"></i>
          <p class="text-sm">正在加载史料文档...</p>
        </div>
      `;
      lucide.createIcons();

      const fileName = type === 'founder' ? 'founder.md' : (type === 'company' ? 'company.md' : 'README.md');
      try {
        const url = `./Founder/${encodeURIComponent(folder)}/${fileName}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error('File not found');
        const text = await res.text();
        
        // Parse markdown to HTML
        const html = marked.parse(text);
        contentEl.innerHTML = DOMPurify.sanitize(html);

      } catch (err) {
        contentEl.innerHTML = `
          <div class="p-12 text-center text-slate-400 bg-slate-50 rounded-2xl border border-slate-200 my-8">
            <p class="text-rose-500 font-semibold mb-1">无法载入 ${fileName}</p>
            <p class="text-xs text-slate-500">请确认文件是否存在。</p>
          </div>
        `;
      }
    }

    // Filter Logic
    function applyFilters() {
      const q = document.getElementById('search-input').value.toLowerCase().trim();
      const country = document.getElementById('country-filter').value;
      const industry = document.getElementById('industry-filter').value;
      const sort = document.getElementById('sort-filter').value;

      currentFiltered = allCompanies.filter(c => {
        const matchQ = !q || c.name_cn.toLowerCase().includes(q) || c.name_en.toLowerCase().includes(q) || c.founder_title.toLowerCase().includes(q) || String(c.rank).includes(q);
        const matchCountry = !country || c.country === country;
        const matchIndustry = !industry || c.industry === industry;
        return matchQ && matchCountry && matchIndustry;
      });

      if (sort === 'size-desc') {
        currentFiltered.sort((a, b) => b.founder_size - a.founder_size);
      } else {
        currentFiltered.sort((a, b) => a.rank - b.rank);
      }

      renderSidebar();
    }

    document.getElementById('search-input').addEventListener('input', applyFilters);
    document.getElementById('country-filter').addEventListener('change', applyFilters);
    document.getElementById('industry-filter').addEventListener('change', applyFilters);
